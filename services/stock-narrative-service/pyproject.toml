[project]
name = "stock-narrative-service"
version = "0.1.0"
description = "Local HTTP narrative service for FNI narrative registry and mapping governance."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stock-narrative-service = "stock_narrative_service.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

