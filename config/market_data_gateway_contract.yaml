version: market-data-gateway-contract-v1
updated_at: "2026-05-27"
base_path: /api/v1/market-data
description: >
  Contract expected by this project for a local market-data gateway. The gateway
  owns cache-hit decisions and upstream fetching; this project only sees a
  stable normalized API surface. The gateway is multi-source, not Tushare-only.
response_envelope:
  success:
    required_top_level_fields:
      - data
      - meta
    rows_path: data.rows
    meta_required_fields:
      - provider
      - endpoint
      - cache
      - generated_at
  error:
    required_top_level_fields:
      - error
    error_required_fields:
      - code
      - message
  cache_meta:
    required_fields:
      - hit
      - mode
    allowed_modes:
      - cache
      - upstream
      - stale_cache
      - mixed
compatibility:
  tushare_native_post:
    enabled: true
    method: POST
    path: /tushare
    request_contract:
      required_fields:
        - api_name
        - token
        - params
        - fields
    response_contract:
      required_top_level_fields:
        - code
        - data
      notes:
        - This optional route preserves the Tushare request shape for low-friction migration.
        - The normalized routes below remain the project-owned long-term contract.
endpoints:
  - endpoint_id: tushare_daily
    dataset_id: a_share_daily_bars
    provider: tushare
    endpoint: daily
    method: POST
    path: /api/v1/market-data/tushare/daily
    cache_policy: read_through_cache
    required_request_fields:
      - symbols
      - start_date
      - end_date
    sample_request:
      json:
        symbols:
          - 600519.SH
        start_date: "2026-05-22"
        end_date: "2026-05-22"
        include_turnover: true
    response:
      rows_path: data.rows
      minimum_rows: 1
      required_fields:
        - symbol
        - trade_date
        - close
        - volume
      optional_fields:
        - open
        - high
        - low
        - pre_close
        - turnover_rate
        - amount
        - source
