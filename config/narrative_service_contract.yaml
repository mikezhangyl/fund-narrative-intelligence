version: narrative-service-contract-v1
ownership:
  consumer_owner: fni
  service_owner: narrative-service
  boundary_doc: docs/product/narrative-service-boundary.md

runtime:
  env_var: NARRATIVE_SERVICE_URL
  default_mode: local_prototype
  response_envelope:
    required_fields:
      - status
      - source
      - provider
      - provider_version
      - data
      - warnings
      - trust_metadata

api_policy:
  base_path: /api/v1/narratives
  current_version: v1
  versioning_rule: additive_non_breaking
  compatibility_rule: new endpoints and optional fields may be added without breaking existing probes
  required_envelope_fields:
    - status
    - source
    - provider
    - provider_version
    - data
    - warnings
    - trust_metadata
  error_semantics:
    missing_id:
      http_status: 200
      status: missing
      data_shape: object_with_error
      warning_required: true
      meaning: Requested id is syntactically valid but no record exists.
    invalid_request:
      http_status: 400
      status: failed
      data_shape: object_with_error
      warning_required: true
      meaning: Request payload or query parameters are invalid.
    service_degraded:
      http_status: 200
      status: degraded
      data_shape: partial_data_with_warnings
      warning_required: true
      meaning: Service is reachable but one or more backing stores or checks are incomplete.

endpoints:
  - method: GET
    path: /api/v1/narratives/registry
    purpose: Return active and candidate narrative registry snapshot.
  - method: GET
    path: /api/v1/narratives/mappings
    purpose: Return stock-to-narrative mapping snapshot.
  - method: POST
    path: /api/v1/narratives/intake/events
    purpose: Accept source events that can create review-only candidate outputs.
  - method: GET
    path: /api/v1/narratives/candidates
    purpose: Return candidate narratives and candidate stock mappings.
  - method: GET
    path: /api/v1/narratives/candidates/{candidate_narrative_id}
    conformance_path: /api/v1/narratives/candidates/C_AUTO_3D71C39000
    purpose: Return one candidate narrative detail with review history, preflight gates, recommended action, and source evidence references.
    missing_id_behavior: missing_envelope
  - method: GET
    path: /api/v1/narratives/evidence-packs
    purpose: Return mapping evidence packs and source citation chains.
  - method: GET
    path: /api/v1/narratives/evidence-packs/{evidence_pack_id}
    conformance_path: /api/v1/narratives/evidence-packs/EPACK_7AF6C98698
    alternate_lookup: /api/v1/narratives/evidence-packs/detail?stock_code=600519&narrative_id=N_BAIJIU_CONSUMPTION
    purpose: Return one stock-to-narrative evidence pack detail with rationale, exclusions, confidence components, and source evidence items.
    missing_id_behavior: missing_envelope
  - method: GET
    path: /api/v1/narratives/trust-audits/latest
    purpose: Return latest registry and mapping trust audit result.
  - method: GET
    path: /api/v1/narratives/ops/summary
    purpose: Return service-level counts, trust statuses, review queue summary, and latest trust-audit state.
  - method: GET
    path: /api/v1/narratives/review-queue
    purpose: Return human review queue items with latest review action, promotion preflight state, status summary, and optional status filtering.
    optional_query:
      status:
        - pending_review
        - ready_for_trust_audit
        - approved_blocked_by_evidence
        - rejected
        - deferred
  - method: GET
    path: /api/v1/narratives/review-actions
    purpose: Return persisted human review actions.
  - method: POST
    path: /api/v1/narratives/review-actions
    purpose: Record approve, reject, or defer decisions without trusted promotion.
    conformance_payload:
      candidate_narrative_id: C_AUTO_3D71C39000
      action: defer
      reviewed_by: conformance-probe
      review_note: Contract smoke only; no trusted promotion.
  - method: POST
    path: /api/v1/narratives/promotion/preflight
    purpose: Check whether a candidate has enough review and evidence gates for a separate trust audit.
    conformance_payload:
      candidate_narrative_id: C_AUTO_3D71C39000

fallback:
  local_prototype:
    registry_path: data/registry/narrative_registry.reviewed.json
    mappings_path: data/registry/stock_narrative_mappings.reviewed.json
    evidence_packs_path: data/registry/mapping_evidence_packs.v0.json
    candidate_events_path: data/fixtures/candidate_narrative_events.v1.json
    disclosure: Local FNI prototype fallback. Not authoritative service storage.

trust_policy:
  automatic_ingestion_may_create:
    - candidate_narratives
    - candidate_stock_mappings
    - candidate_evidence_packs
    - review_queue_items
    - review_action_records
  automatic_ingestion_must_not_create:
    - trusted_narratives
    - trusted_stock_mappings
    - silently_promoted_reviewed_records
    - trusted_records_from_preflight
  trusted_promotion_requires:
    - human_review
    - source_evidence
    - mapping_rationale
    - exclusion_criteria
    - trust_audit

storage_policy:
  current_store: json_file_ledgers_v1
  append_only_ledgers:
    candidate_intake_events:
      path: services/stock-narrative-service/data/runtime/candidate_intake_events.json
      version: service-intake-events-v1
      collection_key: events
      record_type: candidate_intake_event
      required_record_fields:
        - schema_version
        - ledger_record_type
        - ledger_sequence
        - recorded_at
        - event_id
        - source_type
        - event_time
        - source_metadata
        - candidate_narratives
        - promotion_effect
    narrative_review_actions:
      path: services/stock-narrative-service/data/runtime/review_actions.json
      version: narrative-review-actions-v1
      collection_key: items
      record_type: review_action
      required_record_fields:
        - schema_version
        - ledger_record_type
        - ledger_sequence
        - recorded_at
        - review_action_id
        - candidate_narrative_id
        - action
        - reviewed_by
        - reviewed_at
        - review_note
        - source_metadata
        - promotion_effect
    promotion_decisions:
      path: services/stock-narrative-service/data/runtime/promotion_decisions.json
      version: narrative-promotion-decisions-v1
      collection_key: items
      record_type: promotion_decision
      status: reserved
      note: Future trusted-promotion decisions must use a separate append-only ledger.
  mutation_policy:
    review_actions_mutate:
      - review_action_ledger
    review_actions_must_not_mutate:
      - registry
      - mappings
      - evidence_packs
      - candidate_intake_ledger
      - trusted_stores
    failed_intake_writes: none
  replay_policy:
    candidate_reads:
      source_order:
        - seed_fixture_events
        - candidate_intake_events
      duplicate_candidate_rule: latest_event_view_by_candidate_id
      read_side_effects_allowed: false
  migration:
    next_store: sqlite_or_postgres
    threshold: multiple reviewers, concurrent writes, or ledger queries that need transactional indexes
    http_contract_change_allowed: false
    invariant: Storage adapters may change, but HTTP endpoints, envelopes, trust states, and append-only record semantics must remain stable.

identity_policy:
  explicit_id_rule: preserve_non_empty_external_ids
  deterministic_fallbacks:
    source_event_id:
      prefix: EVT
      fields:
        - source_type
        - event_time
        - source_url
        - title
        - summary
    candidate_narrative_id:
      prefix: C_INTAKE
      fields:
        - name
        - canonical_taxonomy
    evidence_pack_id:
      prefix: EPACK
      fields:
        - stock_code
        - narrative_id
    candidate_mapping_id:
      prefix: CMAP
      fields:
        - stock_code
        - narrative_id
    promotion_decision_id:
      prefix: PD
      fields:
        - candidate_narrative_id
        - target_narrative_id
        - review_action_id
  review_action_id:
    prefix: RA
    no_idempotency_key_rule: each accepted action appends a new ledger record keyed by candidate, action, reviewer, note, and reviewed_at
    idempotency_key_rule: same candidate, action, reviewer, and idempotency_key returns the existing decision
  duplicate_detection:
    source_event: same deterministic source event id may replay into the ledger but must collapse to one candidate read model
    candidate: same candidate_narrative_id collapses to one candidate read model with merged source_event_ids
  unknown_id_semantics:
    candidate_narrative_id: reject_without_ledger_write
    evidence_pack_id: return_missing_envelope_without_mutation
