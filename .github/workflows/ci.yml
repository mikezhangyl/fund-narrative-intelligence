name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run V1 acceptance
        run: python scripts/validate_v1_acceptance.py

      - name: Run Stock Narrative Service contract gate
        run: python scripts/validate_stock_narrative_service_acceptance.py

      - name: Run tests with coverage
        run: python -m coverage run -m pytest -q

      - name: Report coverage
        run: python -m coverage report

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts
